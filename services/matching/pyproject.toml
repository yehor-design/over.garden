[project]
name = "matching-tier"
version = "0.1.0"
description = "OverGarden isolated Cyrillic-aware matching/dedup service (FastAPI + worker)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.138.0",
    "uvicorn[standard]==0.49.0",
    "rapidfuzz==3.14.5",
    "splink==4.0.16",
    # PyICU is sdist-only on PyPI — it compiles against the system libicu.
    # The container image installs libicu-dev/pkg-config/build-essential for this.
    "PyICU==2.16.2",
    "cyrtranslit==1.2.0",
    "meilisearch==0.41.1",
    # psycopg v3 with the bundled libpq — the worker connects to Postgres directly.
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
]

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.uv]
# This is an application, not a library — uv installs deps only, no build step.
package = false
# PyICU must build from source against system libicu (it is sdist-only anyway).
no-binary-package = ["pyicu"]

[tool.ruff]
target-version = "py312"
