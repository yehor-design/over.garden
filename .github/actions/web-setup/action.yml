name: Web app setup
description: >-
  pnpm, Node, the per-run Better Auth fixture, dependencies, an S3 stand-in for
  R2, Meilisearch and a bootstrapped schema. Shared by the two jobs of the Web
  app gate, which each declare the Postgres and Meilisearch services this
  expects.

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 9.14.1

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: apps/web/pnpm-lock.yaml

    - name: Generate isolated versioned Better Auth CI fixture
      shell: bash
      working-directory: apps/web
      run: |
        # This value exists only for this run and is never printed, uploaded,
        # or used outside localhost CI.
        # shellcheck disable=SC2016
        node -e 'const { randomBytes } = require("node:crypto"); console.log(`BETTER_AUTH_SECRETS=2:${randomBytes(32).toString("base64url")}`); console.log("BETTER_AUTH_CURRENT_SECRET_VERSION=2")' >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      working-directory: apps/web
      run: pnpm install --frozen-lockfile

    # R2's stand-in. MinIO's images stopped serving anonymous pulls, first
    # `minio/minio` on Docker Hub (2026-09-12), then `quay.io/minio/minio`
    # (2026-09-24): every run, on every branch and on main, failed with
    # "unauthorized" before a test ran. What CI needs of R2 is the S3 API on
    # :9000 — a bucket, its objects and a public-read policy — and moto's
    # server gives it, from PyPI, pinned so that nothing moves under a branch
    # that changed nothing. It is the stand-in the full local gate runs on
    # (`OVE-478-PROOF.md`, Validation). moto accepts any credentials.
    - name: Set up Python for the S3 stand-in
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Start the S3 stand-in
      shell: bash
      run: |
        python -m pip install --quiet --disable-pip-version-check "moto[server]==5.2.3"
        nohup moto_server -H 0.0.0.0 -p 9000 > "$RUNNER_TEMP/s3-stand-in.log" 2>&1 &

        for _ in {1..30}; do
          if curl -fsS http://localhost:9000/ >/dev/null 2>&1; then
            echo "The S3 stand-in is ready."
            exit 0
          fi
          sleep 2
        done

        echo "The S3 stand-in did not become ready in time."
        cat "$RUNNER_TEMP/s3-stand-in.log" || true
        exit 1

    - name: Verify Meilisearch service
      shell: bash
      working-directory: apps/web
      run: |
        for _ in {1..30}; do
          if curl -fsS http://localhost:7700/health >/dev/null 2>&1; then
            echo "Meilisearch is ready."
            exit 0
          fi
          sleep 2
        done

        echo "Meilisearch did not become ready in time."
        exit 1

    - name: Bootstrap schema and object storage
      env:
        PUBLIC_SITE_URL: http://localhost:3000
      shell: bash
      working-directory: apps/web
      run: pnpm local:bootstrap
