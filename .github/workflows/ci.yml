name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - chore/walking-skeleton

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    # ci-required: GitHub-hosted Ubuntu uses Actions service containers and
    # Docker for ad hoc services. This is a platform-bound exception, not a
    # local Docker Desktop prerequisite. Do not move CI to Apple Container
    # unless runner support, cost/availability, and proof commands are
    # recorded in docs/CONTAINER_RUNTIME_POLICY.md.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: overgarden
          POSTGRES_USER: overgarden
          POSTGRES_PASSWORD: overgarden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overgarden -d overgarden"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:v1.48.1
        env:
          MEILI_MASTER_KEY: overgarden-ci-meili-key
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
    defaults:
      run:
        working-directory: apps/web
    env:
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-overgarden-better-auth-secret-for-test-runtime
      DATABASE_URL: postgresql://overgarden:overgarden@localhost:5432/overgarden
      DIRECT_URL: postgresql://overgarden:overgarden@localhost:5432/overgarden
      DATABASE_POOL_MAX: "1"
      DATABASE_SSL: "false"
      R2_ENDPOINT: http://localhost:9000
      R2_ACCESS_KEY_ID: overgarden-ci
      R2_SECRET_ACCESS_KEY: overgarden-ci-secret
      R2_FORCE_PATH_STYLE: "true"
      R2_QUARANTINE_BUCKET: overgarden-quarantine
      R2_PUBLIC_BUCKET: overgarden-public
      R2_PUBLIC_BASE_URL: http://localhost:9000/overgarden-public
      MEILISEARCH_HOST: http://localhost:7700
      MEILISEARCH_API_KEY: overgarden-ci-meili-key
      MATCHING_SERVICE_URL: http://localhost:8000
      MATCHING_SERVICE_TOKEN: overgarden-ci-matching-token
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.14.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check mainline closeout ledger
        run: pnpm mainline:closeout:check

      - name: Start MinIO
        run: |
          # ci-required: GitHub Actions runs this job on Ubuntu, where Apple
          # Container is not the service-container runtime. This does not make
          # Docker Desktop a supported-Mac local prerequisite.
          # See docs/CONTAINER_RUNTIME_POLICY.md.
          docker run --detach --rm \
            --name overgarden-ci-minio \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=overgarden-ci \
            -e MINIO_ROOT_PASSWORD=overgarden-ci-secret \
            minio/minio:latest server /data --console-address ":9001"

          sleep 2

          for attempt in {1..30}; do
            if curl -fsS http://localhost:9000/minio/health/ready >/dev/null 2>&1; then
              echo "MinIO is ready."
              exit 0
            fi
            sleep 2
          done

          echo "MinIO did not become ready in time."
          docker logs overgarden-ci-minio || true
          exit 1

      - name: Verify Meilisearch service
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://localhost:7700/health >/dev/null 2>&1; then
              echo "Meilisearch is ready."
              exit 0
            fi
            sleep 2
          done

          echo "Meilisearch did not become ready in time."
          exit 1

      - name: Bootstrap schema and object storage
        env:
          PUBLIC_SITE_URL: http://localhost:3000
        run: pnpm local:bootstrap

      - name: Verify fresh-bootstrap public identity recovery contract
        run: pnpm smoke:public-identity

      - name: Check generated DB types
        run: pnpm db:types:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify localization route and state coverage
        run: pnpm localization:coverage:check

      - name: Verify Drive2-parity closeout coverage
        run: pnpm drive2:closeout:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify responsive and accessibility matrix
        env:
          PUBLIC_SITE_URL: http://localhost:3000
          DATABASE_POOL_MAX: "4"
          VISUAL_FIXTURES_ENABLED: "true"
          VISUAL_FIXTURES_TARGET: local
          VISUAL_FIXTURES_DATABASE: overgarden
          VISUAL_FIXTURES_ALLOW_PREVIEW: "false"
          ACCESSIBILITY_BASE_URL: http://localhost:3000
        run: |
          pnpm visual:fixtures:seed
          pnpm visual:fixtures:journal-create -- reset all
          pnpm visual:fixtures:journal-create -- run all
          pnpm visual:fixtures:journal-create -- verify all
          pnpm visual:fixtures:journal-create -- reset all
          pnpm visual:fixtures:verify
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/overgarden-a11y-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..60}; do
            if curl -fsS http://localhost:3000/__visual-fixtures >/dev/null 2>&1; then
              pnpm test:a11y
              exit 0
            fi
            sleep 1
          done

          cat /tmp/overgarden-a11y-server.log
          exit 1

  matching:
    name: Python matching tier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/matching
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libicu-dev python3-dev

      - name: Install uv
        run: python -m pip install uv==0.11.24

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile Python modules
        run: find app tests -type f -name '*.py' -print0 | sort -z | xargs -0 uv run --frozen python -m py_compile

      - name: Lint Python matching tier
        run: uv run --frozen ruff check .

      - name: Test Python worker
        run: uv run --frozen pytest -q
