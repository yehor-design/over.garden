name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub-hosted Ubuntu uses Actions service containers and Docker for ad
    # hoc services. This is a platform-bound exception, not a local Docker
    # Desktop prerequisite; see docs/CONTAINER_RUNTIME_POLICY.md.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: overgarden
          POSTGRES_USER: overgarden
          POSTGRES_PASSWORD: overgarden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overgarden -d overgarden"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:v1.48.1
        env:
          MEILI_MASTER_KEY: overgarden-ci-meili-key
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
    defaults:
      run:
        working-directory: apps/web
    env:
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://overgarden:overgarden@localhost:5432/overgarden
      DIRECT_URL: postgresql://overgarden:overgarden@localhost:5432/overgarden
      DATABASE_POOL_MAX: "1"
      DATABASE_SSL: "false"
      # Transactional outbox leasing runs against this PostgreSQL service; the
      # test stays opt-in for non-CI local unit runs.
      OVE219_POSTGRES_INTEGRATION: "true"
      R2_ENDPOINT: http://localhost:9000
      R2_ACCESS_KEY_ID: overgarden-ci
      R2_SECRET_ACCESS_KEY: overgarden-ci-secret
      R2_FORCE_PATH_STYLE: "true"
      R2_PUBLIC_BUCKET: overgarden-public
      R2_PUBLIC_BASE_URL: http://localhost:9000/overgarden-public
      MEILISEARCH_HOST: http://localhost:7700
      MEILISEARCH_API_KEY: overgarden-ci-meili-key
      MATCHING_SERVICE_URL: http://localhost:8000
      MATCHING_SERVICE_TOKEN: overgarden-ci-matching-token
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.14.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Generate isolated versioned Better Auth CI fixture
        run: |
          # This value exists only for this run and is never printed, uploaded,
          # or used outside localhost CI.
          # shellcheck disable=SC2016
          node -e 'const { randomBytes } = require("node:crypto"); console.log(`BETTER_AUTH_SECRETS=2:${randomBytes(32).toString("base64url")}`); console.log("BETTER_AUTH_CURRENT_SECRET_VERSION=2")' >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start MinIO
        run: |
          docker run --detach --rm \
            --name overgarden-ci-minio \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=overgarden-ci \
            -e MINIO_ROOT_PASSWORD=overgarden-ci-secret \
            minio/minio:latest server /data --console-address ":9001"

          for _ in {1..30}; do
            if curl -fsS http://localhost:9000/minio/health/ready >/dev/null 2>&1; then
              echo "MinIO is ready."
              exit 0
            fi
            sleep 2
          done

          echo "MinIO did not become ready in time."
          docker logs overgarden-ci-minio || true
          exit 1

      - name: Verify Meilisearch service
        run: |
          for _ in {1..30}; do
            if curl -fsS http://localhost:7700/health >/dev/null 2>&1; then
              echo "Meilisearch is ready."
              exit 0
            fi
            sleep 2
          done

          echo "Meilisearch did not become ready in time."
          exit 1

      - name: Bootstrap schema and object storage
        env:
          PUBLIC_SITE_URL: http://localhost:3000
        run: pnpm local:bootstrap

      - name: Verify fresh-bootstrap public identity recovery contract
        run: pnpm smoke:public-identity

      - name: Check generated DB types
        run: pnpm db:types:check

      - name: Check the generated job queue contract
        run: pnpm queue:contract:check

      - name: Prove the job queue contract against a database
        run: pnpm queue:contract:prove-database

      - name: Prove the Stable Registry retirement migration and its rollback
        run: pnpm schema:retirement:prove-database

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Banned dependencies
        run: pnpm check:banned-dependencies

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # A public control that needs hydration to act is invisible to every test
      # above: unit renders cannot tell a real form endpoint from React's
      # placeholder, and `next dev` does not exercise the postpone/resume path.
      # This runs a real Chromium against the build produced one step earlier.
      - name: Install Chromium for the browser proof
        run: pnpm exec playwright install --with-deps chromium

      - name: Public hydration proof
        run: |
          pnpm next start -p 3179 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3179/journals && break
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3179 \
            pnpm exec playwright test tests/public-hydration.spec.ts

  matching:
    name: Python matching tier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # The worker's SQL is executed, not mocked: `test_runtime_database.py`
      # builds a disposable database from every versioned migration and runs
      # the worker's own functions against it. Without this service those
      # tests skip, and a statement Postgres refuses is found by the first
      # production deploy instead — as `record_drain_outcome` was on
      # 2026-09-05.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: overgarden
          POSTGRES_USER: overgarden
          POSTGRES_PASSWORD: overgarden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overgarden -d overgarden"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/matching
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libicu-dev python3-dev

      - name: Install uv
        run: python -m pip install uv==0.11.24

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile Python modules
        run: find app tests -type f -name '*.py' -print0 | sort -z | xargs -0 uv run --frozen python -m py_compile

      - name: Lint Python matching tier
        run: uv run --frozen ruff check .

      - name: Test Python worker
        env:
          OVERGARDEN_TEST_DATABASE_URL: postgresql://overgarden:overgarden@localhost:5432/overgarden
        run: uv run --frozen pytest -q
