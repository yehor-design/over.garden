name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - chore/walking-skeleton

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: overgarden
          POSTGRES_USER: overgarden
          POSTGRES_PASSWORD: overgarden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overgarden -d overgarden"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/web
    env:
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-overgarden-better-auth-secret-change-before-deploy
      DATABASE_URL: postgresql://overgarden:overgarden@localhost:5432/overgarden
      DIRECT_URL: postgresql://overgarden:overgarden@localhost:5432/overgarden
      DATABASE_POOL_MAX: "1"
      DATABASE_SSL: "false"
      R2_ENDPOINT: http://localhost:9000
      R2_ACCESS_KEY_ID: overgarden-ci
      R2_SECRET_ACCESS_KEY: overgarden-ci-secret
      R2_FORCE_PATH_STYLE: "true"
      R2_QUARANTINE_BUCKET: overgarden-quarantine
      R2_PUBLIC_BUCKET: overgarden-public
      R2_PUBLIC_BASE_URL: http://localhost:9000/overgarden-public
      MEILISEARCH_HOST: http://localhost:7700
      MEILISEARCH_API_KEY: overgarden-ci-meili-key
      MATCHING_SERVICE_URL: http://localhost:8000
      MATCHING_SERVICE_TOKEN: overgarden-ci-matching-token
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start MinIO
        run: |
          docker run --detach --rm \
            --name overgarden-ci-minio \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=overgarden-ci \
            -e MINIO_ROOT_PASSWORD=overgarden-ci-secret \
            minio/minio:latest server /data --console-address ":9001"

          for attempt in {1..30}; do
            if curl -fsS http://localhost:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "MinIO did not become ready in time."
          exit 1

      - name: Bootstrap schema and object storage
        run: pnpm local:bootstrap

      - name: Check generated DB types
        run: pnpm db:types:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  matching:
    name: Python matching tier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/matching
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libicu-dev python3-dev

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile Python modules
        run: uv run python -m py_compile app/__init__.py app/main.py app/search.py app/worker.py
