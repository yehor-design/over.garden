name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Web app checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub-hosted Ubuntu uses Actions service containers and Docker for ad
    # hoc services. This is a platform-bound exception, not a local Docker
    # Desktop prerequisite; see docs/CONTAINER_RUNTIME_POLICY.md.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: overgarden
          POSTGRES_USER: overgarden
          POSTGRES_PASSWORD: overgarden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overgarden -d overgarden"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:v1.48.1
        env:
          MEILI_MASTER_KEY: overgarden-ci-meili-key
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
    defaults:
      run:
        working-directory: apps/web
    env:
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://overgarden:overgarden@localhost:5432/overgarden
      DIRECT_URL: postgresql://overgarden:overgarden@localhost:5432/overgarden
      DATABASE_POOL_MAX: "1"
      DATABASE_SSL: "false"
      # Transactional outbox leasing runs against this PostgreSQL service; the
      # test stays opt-in for non-CI local unit runs.
      OVE219_POSTGRES_INTEGRATION: "true"
      R2_ENDPOINT: http://localhost:9000
      R2_ACCESS_KEY_ID: overgarden-ci
      R2_SECRET_ACCESS_KEY: overgarden-ci-secret
      R2_FORCE_PATH_STYLE: "true"
      R2_PUBLIC_BUCKET: overgarden-public
      R2_PUBLIC_BASE_URL: http://localhost:9000/overgarden-public
      MEILISEARCH_HOST: http://localhost:7700
      MEILISEARCH_API_KEY: overgarden-ci-meili-key
      MATCHING_SERVICE_URL: http://localhost:8000
      MATCHING_SERVICE_TOKEN: overgarden-ci-matching-token
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up the web app and its services
        uses: ./.github/actions/web-setup


      - name: Verify accepted redesign wireflows
        run: node --test ../../docs/redesign/2026-09-21/wireflows/model.test.mjs

      - name: Verify fresh-bootstrap public identity recovery contract
        run: pnpm smoke:public-identity

      - name: Check generated DB types
        run: pnpm db:types:check

      - name: Check the generated job queue contract
        run: pnpm queue:contract:check

      - name: Prove the job queue contract against a database
        run: pnpm queue:contract:prove-database

      - name: Check the generated address contract
        run: pnpm address:contract:check

      - name: Check that no call site spells a public path
        run: pnpm address:literals:check

      - name: Prove the address slug constraints against a database
        run: pnpm address:contract:prove-database

      - name: Prove every public read against a database
        run: pnpm public:reads:prove-database

      - name: Prove the author-scoped address migration, its triggers and its rollback
        run: pnpm schema:author-addresses:prove-database

      - name: Prove the entry number migration, its counter under concurrency and its rollback
        run: pnpm schema:entry-numbers:prove-database

      - name: Prove the Latin names migration, its guarded constraints and the romanize run
        run: pnpm schema:latin-names:prove-database

      - name: Prove the Stable Registry retirement migration and its rollback
        run: pnpm schema:retirement:prove-database

      - name: Prove the organism graph foundation migration, its backfill and its rollback
        run: pnpm schema:organism-graph:prove-database

      - name: Prove the label migration, its rollback and the picker ranking
        run: pnpm schema:catalog-labels:prove-database

      - name: Prove the card intent migration, its rollback and the revalidation drain
        run: pnpm schema:catalog-card:prove-database

      - name: Prove the owner digest outbox migration and its rollback
        run: pnpm schema:owner-digest:prove-database

      - name: Prove the register form attachment and the picker's market boost
        run: pnpm catalog:registers:prove-database

      - name: Prove the standard species base, its re-run, its rollback and the base-only picker
        run: pnpm catalog:standard-species:prove-database

      - name: Prove the space and object photo, its revocations and its rollback
        run: pnpm schema:owned-photos:prove-database

      - name: Prove the species and cultivar choices, the shared entries, the cold first search and the rollback
        run: pnpm schema:object-species:prove-database

      - name: Prove the catalog health figures, the retention window and its purge
        run: pnpm catalog:health:prove-database

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Banned dependencies
        run: pnpm check:banned-dependencies

      # DESIGN.md §10, gates 3, 6 and 14. The other four mechanical gates are
      # ESLint rules and ran in the Lint step above; gate 9 is the contrast
      # contract inside `globals.test.ts` and runs with the suite; gates 7 and
      # 8 need a browser and run in the Browser proof job beside this one.
      - name: Design system gates
        run: pnpm check:design-tokens && pnpm check:component-tests

      # AGENTS.md rule 11 / ADR-0023: a workspace render path settles every
      # `@/server/*` read. An escape looks like any other `await` and only
      # shows on a hard load with the dependency already broken.
      - name: Workspace settled reads
        run: pnpm check:workspace-settled-reads

      - name: Test
        run: pnpm test

  browser:
    name: Browser proof (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # GitHub-hosted Ubuntu uses Actions service containers and Docker for ad
    # hoc services. This is a platform-bound exception, not a local Docker
    # Desktop prerequisite; see docs/CONTAINER_RUNTIME_POLICY.md.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: overgarden
          POSTGRES_USER: overgarden
          POSTGRES_PASSWORD: overgarden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overgarden -d overgarden"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:v1.48.1
        env:
          MEILI_MASTER_KEY: overgarden-ci-meili-key
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
    defaults:
      run:
        working-directory: apps/web
    env:
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://overgarden:overgarden@localhost:5432/overgarden
      DIRECT_URL: postgresql://overgarden:overgarden@localhost:5432/overgarden
      DATABASE_POOL_MAX: "1"
      DATABASE_SSL: "false"
      # Transactional outbox leasing runs against this PostgreSQL service; the
      # test stays opt-in for non-CI local unit runs.
      OVE219_POSTGRES_INTEGRATION: "true"
      R2_ENDPOINT: http://localhost:9000
      R2_ACCESS_KEY_ID: overgarden-ci
      R2_SECRET_ACCESS_KEY: overgarden-ci-secret
      R2_FORCE_PATH_STYLE: "true"
      R2_PUBLIC_BUCKET: overgarden-public
      R2_PUBLIC_BASE_URL: http://localhost:9000/overgarden-public
      MEILISEARCH_HOST: http://localhost:7700
      MEILISEARCH_API_KEY: overgarden-ci-meili-key
      MATCHING_SERVICE_URL: http://localhost:8000
      MATCHING_SERVICE_TOKEN: overgarden-ci-matching-token
      # The EPPO archive is dark unless the environment opens it (ADR-0025
      # D3). The gate opens it so the archive's own document is what the specs
      # prove; with it closed every archive address is the proxy's 404, which
      # `src/proxy.test.ts` proves instead. It is read at build time too, since
      # `/sources/eppo` is a static document.
      STABLE_REGISTRY_PUBLIC_DISCOVERY: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up the web app and its services
        uses: ./.github/actions/web-setup

      - name: Build
        run: pnpm build

      # A public control that needs hydration to act is invisible to every unit
      # test: a render cannot tell a real form endpoint from React's
      # placeholder, and `next dev` does not take the prerender, postpone and
      # resume path. This runs a real Chromium against the build one step up.
      - name: Install Chromium for the browser proof
        run: pnpm exec playwright install --with-deps chromium

      # One list, in `scripts/browser-gate-specs.ts`, run one way, by
      # `scripts/run-browser-gate.ts`: it seals the owner account, starts
      # `next start` on the origin Better Auth is told about, hands both sides a
      # cron secret made for this run, and runs this shard of the list. The
      # list used to be spelled here and again in `package.json`, and seven
      # specs were in neither (`OVE-462`). `pnpm check:browser-specs`, in the
      # checks job's Test step, fails on a spec that nothing runs.
      - name: The browser gate
        run: pnpm exec tsx scripts/run-browser-gate.ts --shard=${{ matrix.shard }}/2

      # A test that fails once and passes on its retry is reported "flaky" and
      # the run is green, so its one useful artefact — the trace of the attempt
      # that failed — used to go with the runner. Kept for a week.
      - name: Keep the traces of what failed or flaked
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-proof-traces-${{ matrix.shard }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The required check. Branch protection names "Web app", so this is the job
  # that carries the name: it runs whatever happened to the two above and
  # passes only if both did. `if: always()` matters — a job skipped because a
  # job it needs failed reports "skipped", and a skipped required check counts
  # as passed.
  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks, browser]
    if: always()
    steps:
      - name: Every part of the gate passed
        run: |
          echo "checks: ${{ needs.checks.result }}"
          echo "browser: ${{ needs.browser.result }}"
          test "${{ needs.checks.result }}" = "success"
          test "${{ needs.browser.result }}" = "success"

  matching:
    name: Python matching tier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # The worker's SQL is executed, not mocked: `test_runtime_database.py`
      # builds a disposable database from every versioned migration and runs
      # the worker's own functions against it. Without this service those
      # tests skip, and a statement Postgres refuses is found by the first
      # production deploy instead — as `record_drain_outcome` was on
      # 2026-09-05.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: overgarden
          POSTGRES_USER: overgarden
          POSTGRES_PASSWORD: overgarden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overgarden -d overgarden"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/matching
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libicu-dev python3-dev

      - name: Install uv
        run: python -m pip install uv==0.11.24

      - name: Install the pinned gnparser release
        run: scripts/install-gnparser.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile Python modules
        run: find app tests -type f -name '*.py' -print0 | sort -z | xargs -0 uv run --frozen python -m py_compile

      - name: Lint Python matching tier
        run: uv run --frozen ruff check .

      - name: Test Python worker
        env:
          OVERGARDEN_TEST_DATABASE_URL: postgresql://overgarden:overgarden@localhost:5432/overgarden
        run: uv run --frozen pytest -q
