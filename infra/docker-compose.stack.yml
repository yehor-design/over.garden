name: overgarden-stack

# OVE-358 — the whole product as one composed stack.
#
# `infra/docker-compose.yml` is a development convenience: three services, no
# pooler, no Postgres TLS, no reverse proxy, no worker. The production
# definition is split across two files that each assume a managed database
# beside them. Between them the project could describe a self-hosted stack but
# could not start one.
#
# This file is the composed definition. It is deliberately provider-neutral:
# nothing here names a hosting company, and every value a specific host needs
# arrives through the environment.
#
# production-linux-required under `docs/CONTAINER_RUNTIME_POLICY.md`. Apple
# Container remains the preferred supported-Mac local runtime; a Linux host
# running this stack is the recorded platform-bound exception, which is why this
# is authored as a portable Compose recipe rather than a runtime-specific one.

services:
  # Postgres speaks TLS to everything, including the pooler on the same host.
  # A stack that is one `docker network` away from a laptop is not a reason to
  # send credentials in the clear.
  postgres:
    image: postgres:18-alpine
    container_name: overgarden-stack-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgres-tls/server.crt
      - -c
      - ssl_key_file=/etc/postgres-tls/server.key
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-overgarden}
      POSTGRES_USER: ${POSTGRES_USER:-overgarden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/stack.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Generated by `infra/overgarden-stack up`; never committed.
      - ${OVERGARDEN_STACK_TLS_DIR:-./stack-tls}:/etc/postgres-tls:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The application connects here, never to Postgres directly. A managed
  # database supplied this; self-hosting removes it, and without it a serverless
  # deployment opens one connection per instance until Postgres refuses.
  #
  # Transaction pooling is the mode that makes that saving real — and it is also
  # why the matching worker must NOT come through here. `LISTEN`/`NOTIFY` needs
  # a session that outlives a transaction, and transaction pooling does not give
  # it one. The worker gets `DIRECT_URL`; everything else gets `DATABASE_URL`.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: overgarden-stack-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-overgarden}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/stack.env}
      DB_NAME: ${POSTGRES_DB:-overgarden}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-500}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      AUTH_TYPE: scram-sha-256
      # Transaction pooling cannot carry a session-scoped prepared statement.
      # The application uses unnamed parameterised statements, which is why this
      # is safe here and would not be with a client that names them.
      MAX_PREPARED_STATEMENTS: "0"
      SERVER_TLS_SSLMODE: verify-full
      SERVER_TLS_CA_FILE: /etc/postgres-tls/ca.crt
    volumes:
      - ${OVERGARDEN_STACK_TLS_DIR:-./stack-tls}:/etc/postgres-tls:ro
    expose:
      - "6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U $${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Pinned to the OCI **index** digest, not a per-architecture one.
  #
  # The production file pins `sha256:93ea15e3…`, which is the linux/amd64
  # manifest alone. That pull fails outright on an ARM host. The index digest is
  # equally immutable and resolves to the right architecture, which is what a
  # stack meant to run anywhere needs.
  meilisearch:
    image: getmeili/meilisearch:v1.48.1@sha256:ad98ec0ab2a387da5c140fe9d935eadc6e3a42aee185b4249dfafd985fb49e1c
    container_name: overgarden-stack-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in infra/stack.env}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    expose:
      - "7700"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Direct to Postgres on purpose — see the pooler comment above.
  matching-worker:
    image: ${OVERGARDEN_MATCHING_IMAGE:?set OVERGARDEN_MATCHING_IMAGE to an immutable digest}
    container_name: overgarden-stack-matching-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    environment:
      DIRECT_URL: >-
        postgresql://${POSTGRES_USER:-overgarden}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-overgarden}?sslmode=verify-full&sslrootcert=/etc/postgres-tls/ca.crt
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY}
      QUEUE_NAME: matching
      WORKER_NOTIFY_CHANNEL: matching_worker_wake
      OVERGARDEN_MATCHING_COMMIT_SHA: ${OVERGARDEN_MATCHING_COMMIT_SHA:?set the exact release commit}
      OVERGARDEN_MATCHING_IMAGE_DIGEST: ${OVERGARDEN_MATCHING_IMAGE_DIGEST:?set the exact image digest}
      OVERGARDEN_MATCHING_BUILD_TIMESTAMP: ${OVERGARDEN_MATCHING_BUILD_TIMESTAMP:?set the build timestamp}
      OVERGARDEN_MATCHING_SCHEMA_COMPATIBILITY: ove190.matching-schema.v1
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:?set the public media origin}
    volumes:
      - ${OVERGARDEN_STACK_TLS_DIR:-./stack-tls}:/etc/postgres-tls:ro

  # The only service that listens on a public port. Everything else is reachable
  # on the internal network alone, which is why no other service publishes one.
  caddy:
    image: caddy:2.10-alpine
    container_name: overgarden-stack-caddy
    restart: unless-stopped
    depends_on:
      meilisearch:
        condition: service_healthy
    ports:
      - "${STACK_HTTP_PORT:-80}:80"
      - "${STACK_HTTPS_PORT:-443}:443"
    environment:
      OVERGARDEN_STACK_HOSTNAME: ${OVERGARDEN_STACK_HOSTNAME:-localhost}
    volumes:
      - ${OVERGARDEN_STACK_CADDYFILE:-./Caddyfile.stack}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
    name: overgarden-stack-postgres-18-data
  meili_data:
    name: overgarden-stack-meili-v1481-data
  caddy_data:
    name: overgarden-stack-caddy-data
  caddy_config:
    name: overgarden-stack-caddy-config
